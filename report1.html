<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学記号ノート | 元素手帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #c7d94a;
    --bg-deep: #b0c235;
    --brown-deep: #5a3820;
    --brown-mid: #7c4e2c;
    --brown-light: #c99a63;
    --paper: #f6efdc;
    --paper-dim: #ece0c4;
    --ink: #2c1c10;
    --ink-soft: #4a3521;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(0deg, rgba(90,56,32,0.05) 0, rgba(90,56,32,0.05) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(90,56,32,0.05) 0, rgba(90,56,32,0.05) 1px, transparent 1px, transparent 32px);
    color: var(--ink);
    font-family: 'Shippori Mincho', serif;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  /* ---------- Header (shared) ---------- */

  header{
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--brown-deep);
    border-bottom: 3px solid var(--ink);
    padding: 14px 6vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--paper);
    text-decoration: none;
  }

  .brand-tile{
    width: 34px;
    height: 34px;
    border: 2px solid var(--paper);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 15px;
  }

  .brand-name{
    font-size: 19px;
    letter-spacing: 0.06em;
  }

  nav{
    display: flex;
    gap: 4px;
  }

  nav a{
    text-decoration: none;
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 7px 14px;
    border: 1px solid rgba(246,239,220,0.35);
    border-radius: 3px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  nav a:hover{
    background: rgba(246,239,220,0.12);
    border-color: var(--paper);
  }

  nav a.current{
    background: var(--paper);
    color: var(--brown-deep);
    border-color: var(--paper);
  }

  /* ---------- Page head ---------- */

  .page-head{
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 6vw 24px;
    text-align: center;
  }

  .eyebrow-tile{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 2px solid var(--brown-deep);
    border-radius: 4px;
    padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--brown-deep);
    box-shadow: 3px 3px 0 var(--brown-mid);
  }

  .page-head h1{
    font-size: 26px;
    margin: 18px 0 10px;
    letter-spacing: 0.04em;
  }

  .page-head p{
    font-size: 14.5px;
    color: var(--ink-soft);
  }

  .back{
    display: inline-block;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    text-decoration: none;
    color: var(--brown-deep);
    border-bottom: 1px solid var(--brown-deep);
  }

  /* ---------- Search ---------- */

  .search-wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 6px 6vw 8px;
  }

  .search{
    width: 100%;
    background: var(--paper);
    border: 2px solid var(--brown-deep);
    border-radius: 5px;
    padding: 11px 14px;
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    color: var(--ink);
    box-shadow: 3px 3px 0 var(--brown-mid);
  }

  .search:focus{ outline: 2px solid var(--brown-mid); outline-offset: 2px; }

  .count{
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--brown-deep);
    text-align: right;
  }

  /* ---------- Entries ---------- */

  .list{
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 6vw 80px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .el{
    display: flex;
    gap: 20px;
    background: var(--paper);
    border: 2px solid var(--brown-deep);
    border-radius: 6px;
    padding: 18px 20px 20px;
    box-shadow: 4px 4px 0 rgba(90,56,32,0.3);
  }

  .el-tile{
    flex: none;
    width: 96px;
    height: 104px;
    border: 2px solid var(--brown-deep);
    border-radius: 4px;
    background: var(--paper-dim);
    padding: 5px 7px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
  }

  .el-tile .no{
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .el-tile .sym{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 40px;
    line-height: 1;
    color: var(--brown-deep);
  }

  .el-tile .nm{
    font-size: 12px;
    font-weight: 600;
  }

  .el-body{ min-width: 0; }

  .el-body .read{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--brown-mid);
    letter-spacing: 0.04em;
  }

  .el-body h2{
    margin: 0 0 6px;
    font-size: 19px;
    color: var(--brown-deep);
    letter-spacing: 0.04em;
  }

  .el-body .desc{
    margin: 0;
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.8;
  }

  .el-body .found{
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--brown-light);
    font-size: 13.5px;
    color: var(--ink);
  }

  .el-body .found .label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--brown-mid);
    margin-right: 8px;
  }

  .empty{
    display: none;
    text-align: center;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 30px 0;
  }

  /* ---------- Footer (shared) ---------- */

  footer{
    padding: 50px 6vw 40px;
    background: var(--brown-deep);
    color: var(--paper-dim);
  }

  .footer-grid{
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 40px;
  }

  footer h3{
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
    color: var(--brown-light);
    margin: 0 0 14px;
  }

  .contact-form{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .contact-form input,
  .contact-form textarea{
    background: rgba(246,239,220,0.08);
    border: 1px solid rgba(246,239,220,0.3);
    border-radius: 3px;
    padding: 9px 11px;
    color: var(--paper);
    font-family: 'Shippori Mincho', serif;
    font-size: 14px;
  }

  .contact-form textarea{ resize: vertical; min-height: 70px; }

  .contact-form button{
    align-self: flex-start;
    background: var(--brown-light);
    color: var(--brown-deep);
    border: none;
    border-radius: 3px;
    padding: 9px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .contact-form button:hover{ background: #dcb27f; }

  .notice{
    font-size: 12.5px;
    line-height: 1.8;
    color: rgba(246,239,220,0.65);
    margin: 0 0 20px;
  }

  .hub-link{
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--paper);
    text-decoration: none;
    border-bottom: 1px solid rgba(246,239,220,0.5);
    padding-bottom: 1px;
  }

  .foot-bottom{
    max-width: 900px;
    margin: 34px auto 0;
    padding-top: 18px;
    border-top: 1px solid rgba(246,239,220,0.2);
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(246,239,220,0.5);
    text-align: center;
  }

  @media (max-width: 720px){
    .footer-grid{ grid-template-columns: 1fr; }
    nav{ order: 3; width: 100%; justify-content: center; flex-wrap: wrap; }
  }

  @media (max-width: 480px){
    .el{ flex-direction: column; gap: 14px; }
    .el-tile{ width: 100%; height: auto; flex-direction: row; align-items: center; gap: 14px; padding: 8px 12px; }
    .el-tile .no{ order: 0; }
    .el-tile .sym{ font-size: 34px; }
    .el-tile .nm{ margin-left: auto; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <span class="brand-tile">Gt</span>
    <span class="brand-name">元素手帖</span>
  </a>
  <nav>
    <a href="index.html">index</a>
    <a href="blog.html">blog</a>
    <a class="current" href="column.html">column</a>
    <a href="about.html">about</a>
  </nav>
</header>

<div class="page-head">
  <span class="eyebrow-tile">No. 05 / Nt</span>
  <h1>化学記号ノート</h1>
  <p>元素記号、読み方、解説、どんなものに含まれているか。ひとつずつ書き留めていく辞典ノートです。</p>
  <a class="back" href="column.html">← column へ戻る</a>
</div>

<div class="search-wrap">
  <input class="search" id="q" type="search" placeholder="元素記号・名前・読み方・含まれるものでしぼりこみ（例: Fe / 鉄 / 水）">
  <div class="count" id="count"></div>
</div>

<main class="list" id="list"></main>
<div class="empty" id="empty">見つかりませんでした。別のことばで探してみてください。</div>

<footer>
  <div class="footer-grid">
    <div>
      <h3>CONTACT</h3>
      <form class="contact-form" action="https://formspree.io/f/maqvpvoz" method="POST">
        <input type="text" name="name" placeholder="お名前" required>
        <input type="email" name="email" placeholder="メールアドレス" required>
        <textarea name="message" placeholder="メッセージ" required></textarea>
        <button type="submit">送信する</button>
      </form>
    </div>
    <div>
      <h3>NOTICE</h3>
      <p class="notice">本サイトに掲載する文章・イラスト・漫画等のコンテンツについて、生成AIモデルの学習データとしての使用を固く禁じます。</p>
      <h3>LINK</h3>
      <a class="hub-link" href="#">Azalea Creative Room</a>
    </div>
  </div>
  <div class="foot-bottom">© 元素手帖 — Azalea Creative Room</div>
</footer>

<script>
  // 元素を増やすときは、下の配列に1行ずつ追加するだけです。
  // [原子番号, 元素記号, 元素名, 読み方, 解説, 何に含まれているか]
  var ELEMENTS = [
    [1,  "H",  "水素", "すいそ", "いちばん軽い元素。宇宙でもっとも多く存在し、燃えると酸素と結びついて水になる。", "水、酸、太陽などの恒星、生き物の体"],
    [2,  "He", "ヘリウム", "へりうむ", "とても軽く、他の物質とほとんど反応しない貴ガスのなかま。吸うと声が高くなる。", "風船、天然ガスの一部、太陽"],
    [3,  "Li", "リチウム", "りちうむ", "いちばん軽い金属。電気を蓄えるのが得意で、充電池に欠かせない。", "リチウムイオン電池（スマホ・パソコン）"],
    [6,  "C",  "炭素", "たんそ", "生き物の体をつくる有機物の骨格になる元素。並び方しだいでダイヤモンドにも黒鉛にもなる。", "ダイヤモンド、鉛筆の芯、二酸化炭素、生き物の体"],
    [7,  "N",  "窒素", "ちっそ", "空気の約78%を占める気体。ふだんは反応しにくいが、タンパク質や肥料の材料になる。", "空気、タンパク質、肥料"],
    [8,  "O",  "酸素", "さんそ", "空気の約21%を占め、ものが燃えたり、生き物が呼吸したりするのに必要な元素。", "空気、水、鉄のさび、岩石"],
    [9,  "F",  "フッ素", "ふっそ", "非常に反応しやすい元素。化合物になると、歯を守ったり、くっつきにくい加工に使われたりする。", "歯みがき粉（フッ化物）、フッ素樹脂加工のフライパン"],
    [10, "Ne", "ネオン", "ねおん", "他の物質と反応しにくい貴ガス。電気を通すと赤っぽく光る。", "ネオンサイン"],
    [11, "Na", "ナトリウム", "なとりうむ", "やわらかく、水に入れると激しく反応する金属。化合物では身近なところにたくさんある。", "食塩（塩化ナトリウム）、重曹"],
    [12, "Mg", "マグネシウム", "まぐねしうむ", "軽い金属で、燃やすと白くまぶしい光を出す。植物の葉の緑色の成分にも含まれる。", "にがり、葉緑素（クロロフィル）、花火やフラッシュの白い光"],
    [13, "Al", "アルミニウム", "あるみにうむ", "軽くてさびにくく、加工しやすい金属。リサイクルもしやすい。", "アルミ缶、一円玉、サッシ"],
    [14, "Si", "ケイ素", "けいそ", "地球の地殻に酸素の次に多い元素。電気の通りやすさを調整できるので半導体の材料になる。", "砂、ガラス、石英、半導体チップ"],
    [15, "P",  "リン", "りん", "生き物にとって大切な元素。赤リンは摩擦で火がつきやすい性質を利用される。", "マッチの側薬（赤リン）、DNA、骨や歯、肥料"],
    [16, "S",  "硫黄", "いおう", "黄色い固体の元素。火山や温泉の近くでよく見られる。", "温泉、火山、ゴムの加工、温泉卵のにおいのもと（硫化水素）"],
    [17, "Cl", "塩素", "えんそ", "黄緑色で毒性のある気体。殺菌や漂白の力が強い。", "食塩、プールの消毒、塩酸、漂白剤"],
    [19, "K",  "カリウム", "かりうむ", "ナトリウムと似ていて、水と激しく反応する金属。植物の成長に欠かせない。", "野菜や果物（バナナなど）、肥料、草木灰"],
    [20, "Ca", "カルシウム", "かるしうむ", "骨や歯、貝がらの主成分になる金属元素。", "骨、歯、貝がら、卵のから、石灰岩、チョーク"],
    [26, "Fe", "鉄", "てつ", "強くて加工しやすく、人の暮らしを支えてきた金属。湿った空気にふれるとさびる。", "鉄骨、くぎ、血液（ヘモグロビン）、さび"],
    [29, "Cu", "銅", "どう", "電気や熱をよく伝える赤っぽい金属。空気にふれると緑青（ろくしょう）がつく。", "十円玉、電線、銅像"],
    [30, "Zn", "亜鉛", "あえん", "鉄をさびから守るメッキに使われる金属。銅と混ぜると真鍮（しんちゅう）になる。", "トタン、乾電池、真鍮（五円玉など）"],
    [47, "Ag", "銀", "ぎん", "金属のなかでも電気をもっともよく通す。白く美しい光沢がある。", "銀食器、アクセサリー、電子部品"],
    [79, "Au", "金", "きん", "さびにくく、美しい輝きが長持ちする金属。やわらかくて加工しやすい。", "金貨、延べ棒、指輪、電子部品"],
    [80, "Hg", "水銀", "すいぎん", "常温で液体の、めずらしい金属。有毒なので、現在は使用が減っている。", "昔の体温計、蛍光灯（微量）"],
    [82, "Pb", "鉛", "なまり", "重くてやわらかい金属。有毒なので、昔より使われる場面は少なくなっている。", "鉛蓄電池（自動車のバッテリー）、昔のはんだ"]
  ];

  var list = document.getElementById("list");
  var q = document.getElementById("q");
  var countEl = document.getElementById("count");
  var emptyEl = document.getElementById("empty");

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function render(items){
    list.innerHTML = items.map(function(e){
      return '<article class="el">' +
        '<div class="el-tile"><div class="no">' + e[0] + '</div><div class="sym">' + esc(e[1]) + '</div><div class="nm">' + esc(e[2]) + '</div></div>' +
        '<div class="el-body">' +
          '<div class="read">' + esc(e[1]) + ' / ' + esc(e[3]) + '</div>' +
          '<h2>' + esc(e[2]) + '</h2>' +
          '<p class="desc">' + esc(e[4]) + '</p>' +
          '<div class="found"><span class="label">含まれるもの</span>' + esc(e[5]) + '</div>' +
        '</div>' +
      '</article>';
    }).join("");
    countEl.textContent = items.length + " / " + ELEMENTS.length + " 件";
    emptyEl.style.display = items.length ? "none" : "block";
  }

  function filter(){
    var key = q.value.trim().toLowerCase();
    if(!key){ render(ELEMENTS); return; }
    render(ELEMENTS.filter(function(e){
      return e.join(" ").toLowerCase().indexOf(key) !== -1;
    }));
  }

  q.addEventListener("input", filter);
  render(ELEMENTS);
</script>

</body>
</html>
